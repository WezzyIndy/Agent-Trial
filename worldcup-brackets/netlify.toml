[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

# SPA fallback: send all non-API, non-asset routes to index.html
[[redirects]]
  from = "/.netlify/functions/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
